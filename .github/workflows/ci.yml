name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install .
      - name: Import danmaku client and API
        run: python -c 'from blrec.bili.api import WebApi; from blrec.bili.danmaku_client import DanmakuClient'
      - name: Check WBI signing
        run: python -m blrec.bili.wbi
